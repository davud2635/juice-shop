name: Scenario 1 - Monolithic Pipeline
on: 
  workflow_dispatch: 

jobs:
  all-in-one-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SAST Scan (Semgrep Full)
        run: >
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep
          semgrep scan --config p/default --config p/owasp-top-ten

      - name: SCA Container Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'bkimminich/juice-shop:latest'
          format: 'table'
          exit-code: '0' # We set to 0 so it doesn't stop our experiment early

      - name: Start Juice Shop (Simulated Staging)
        run: |
          docker run -d -p 3000:3000 bkimminich/juice-shop:latest
          sleep 15 # Wait for the server to start
          
      - name: DAST Scan (OWASP ZAP)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3000'
