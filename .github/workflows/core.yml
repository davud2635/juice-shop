name: Scenario 2 - Core Pipeline (Track 1)
on:
  workflow_dispatch:

jobs:
  fast-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fast SAST (Secrets Only)
        run: >
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep
          semgrep scan --config p/secrets

      - name: SCA Container Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'bkimminich/juice-shop:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '0'

      - name: Simulated Deployment
        run: echo "Core build passed! Simulating deployment..."
