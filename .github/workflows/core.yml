name: Scenario 2 - Core Pipeline (Track 1)
on: 
  workflow_dispatch:

jobs:
  fast-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fast SAST (Secrets Only)
        run: >
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep
          semgrep scan --config p/secrets

      - name: Simulated Deployment
        run: echo "Core build passed! Simulating deployment..."
